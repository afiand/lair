# ============================================================================
# Grafana Loki values for LAiR
# Chart: grafana/loki (6.x+)
# Architecture: SingleBinary (required for filesystem storage)
# ============================================================================

# SingleBinary mode is required for filesystem storage (no object storage)
deploymentMode: SingleBinary
singleBinary:
  replicas: 1

# Disable scalable targets (not compatible with filesystem storage)
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

loki:
  auth_enabled: false
  # Storage: filesystem (local PVC)
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  limits_config:
    retention_period: 168h  # 7 days

  # Schema config (required)
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
