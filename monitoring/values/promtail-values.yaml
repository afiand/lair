# Grafana Promtail values for LAiR
# Reference: https://github.com/grafana/helm-charts/tree/main/charts/promtail

config:
  clients:
    - url: http://loki.monitoring.svc:3100/loki/api/v1/push

  positions:
    filename: /run/promtail/positions.yaml

  scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_container_name]
          action: replace
          target_label: container
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          action: replace
          target_label: app
          regex: (.*)

    - job_name: kubernetes-pods-infrastructure
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_namespace]
          action: keep
          regex: (kube-system|ingress-nginx|longhorn-system|cert-manager)
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: namespace

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi