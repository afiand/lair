# ============================================================================
# Grafana Promtail values for LAiR
# Chart: grafana/promtail
# The default scrapeConfigs already scrapes all pods via k8s_sd (role: pod),
# so we only need to point clients at our Loki gateway.
# ============================================================================

config:
  enabled: true
  logLevel: info
  logFormat: logfmt
  serverPort: 3101

  # Point Promtail at our Loki gateway service
  # (release: lair-loki → gateway service: lair-loki-gateway)
  clients:
    - url: http://lair-loki-gateway.monitoring.svc:80/loki/api/v1/push

  positions:
    filename: /run/promtail/positions.yaml

  # Use the default scrape config (kubernetes-pods, role: pod)
  # which already picks up ALL pods including namespace "lair"
  # Add any extra relabel configs here if needed:
  # snippets:
  #   extraRelabelConfigs:
  #     - source_labels: [__meta_kubernetes_namespace]
  #       action: replace
  #       target_label: team
  #       replacement: lair

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
